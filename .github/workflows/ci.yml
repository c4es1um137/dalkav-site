# Verification only: Cloudflare Pages builds and deploys from its Git integration.
# No deploy step and no Cloudflare API token here.
name: CI

on:
  pull_request:
    branches: [main, test]
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Production build + content guard + verify-dist
        env:
          SITE_ENV: production
          CONTENT_DENYLIST: ${{ secrets.CONTENT_DENYLIST }}
        run: |
          npx astro build
          node scripts/content-guard.mjs
          node scripts/verify-dist.mjs --env production

      - name: Test build + content guard + verify-dist
        env:
          SITE_ENV: test
          CONTENT_DENYLIST: ${{ secrets.CONTENT_DENYLIST }}
        run: |
          npx astro build
          node scripts/content-guard.mjs
          node scripts/verify-dist.mjs --env test
